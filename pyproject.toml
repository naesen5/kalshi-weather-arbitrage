[project]
name = "kalshi-weather-arbitrage"
version = "0.1.0"
description = "Find and trade weather contracts on Kalshi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=4,<8",
    "ruff>=0.1,<0.2",
    "mypy>=1.0,<2",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "C", "B"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
ignore_missing_imports = true
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
